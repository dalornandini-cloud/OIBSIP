<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Convert temperatures between Celsius, Fahrenheit, and Kelvin.">
  <title>Temperature Converter</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="page-shell">
    <section class="converter-card" aria-labelledby="page-title">
      <header class="card-header">
        <span class="thermometer-icon" aria-hidden="true">°</span>
        <p class="eyebrow">A simple tool for curious minds</p>
        <h1 id="page-title">Temperature Converter</h1>
        <p class="subtitle">Switch between Celsius, Fahrenheit, and Kelvin in a snap.</p>
      </header>

      <form class="converter-form" id="converter-form" novalidate>
        <div class="field-group">
          <label for="temperature">Temperature</label>
          <input
            id="temperature"
            name="temperature"
            type="text"
            inputmode="decimal"
            placeholder="e.g. 36.6"
            autocomplete="off"
            aria-describedby="input-error"
            aria-invalid="false"
          >
          <p class="error-message" id="input-error" aria-live="polite"></p>
        </div>

        <div class="field-group">
          <label for="unit">Input unit</label>
          <select id="unit" name="unit">
            <option value="celsius">Celsius (°C)</option>
            <option value="fahrenheit">Fahrenheit (°F)</option>
            <option value="kelvin">Kelvin (K)</option>
          </select>
        </div>

        <div class="form-actions">
          <button class="button button-primary" type="submit">Convert <span aria-hidden="true">→</span></button>
          <button class="button button-secondary" id="reset-button" type="reset">Reset</button>
        </div>
      </form>

      <section class="results" id="results" aria-labelledby="results-title" aria-live="polite" hidden>
        <div class="results-heading">
          <div>
            <p class="eyebrow">Your results</p>
            <h2 id="results-title">Here’s the conversion</h2>
          </div>
          <span class="result-check" aria-hidden="true">✓</span>
        </div>

        <div class="result-grid">
          <article class="result-card result-celsius" data-result-unit="celsius">
            <p class="result-label">Celsius</p>
            <p class="result-value"><span id="result-celsius">—</span><span class="unit-symbol">°C</span></p>
          </article>
          <article class="result-card result-fahrenheit" data-result-unit="fahrenheit">
            <p class="result-label">Fahrenheit</p>
            <p class="result-value"><span id="result-fahrenheit">—</span><span class="unit-symbol">°F</span></p>
          </article>
          <article class="result-card result-kelvin" data-result-unit="kelvin">
            <p class="result-label">Kelvin</p>
            <p class="result-value"><span id="result-kelvin">—</span><span class="unit-symbol">K</span></p>
          </article>
        </div>

        <p class="formula-line" id="formula-line"></p>
      </section>

      <p class="card-footnote">For accurate results, temperatures must be at or above absolute zero.</p>
    </section>
  </main>
</body>
</html>
